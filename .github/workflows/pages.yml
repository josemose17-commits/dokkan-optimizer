name: Validate and deploy GitHub Pages

# Pull requests into any branch are validated (stacked PRs included); they
# never deploy. Only main is published.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests and build steps do not receive deployment permissions.
permissions:
  contents: read

# One run per ref at a time. Superseded pull-request runs are cancelled.
# Runs on main are queued, never cancelled mid-deployment; the deploy job
# below additionally refuses to publish a revision that is no longer main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Name kept stable so existing required-check settings keep matching.
    name: Test and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up required Node.js version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      # npm run build also runs the project's strict TypeScript check
      # (including the browser-test sources).
      - name: Type check and build production assets
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      # Serves the dist/ built above under /dokkan-optimizer/: the browser
      # tests exercise exactly the files that are uploaded next.
      - name: Run browser tests against this build
        run: npx playwright test

      - name: Upload dist for GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Deploy main to GitHub Pages
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Serialize only deployments; do not cancel an active publication.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      # A newer main commit has its own run queued behind this one. Publishing
      # this older artifact could overwrite a newer deployment, or outlive a
      # newer run that failed validation, so only the current head deploys.
      - name: Confirm this revision is still the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current="$(gh api "repos/${REPOSITORY}/commits/main" --jq .sha)"
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is now ${current}; ${GITHUB_SHA} was validated but is not deployed."
          fi

      - name: Configure GitHub Pages
        if: ${{ steps.head.outputs.deploy == 'true' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy built artifact
        id: deployment
        if: ${{ steps.head.outputs.deploy == 'true' }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
